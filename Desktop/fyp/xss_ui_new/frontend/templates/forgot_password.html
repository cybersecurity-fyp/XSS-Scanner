<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XSSniper — Forgot Password</title>
<link rel="stylesheet" href="/static/css/style.css">
<!-- Prevent flash of wrong theme -->
<script src="/static/js/core/theme.js"></script>
</head>
<body>
<div class="auth-bg">
  <div class="auth-orb auth-orb-1"></div>
  <div class="auth-orb auth-orb-2"></div>

  <button class="theme-toggle auth-theme-btn" onclick="toggleTheme()" aria-label="Toggle theme">
    <span class="theme-icon theme-icon-dark">🌙</span>
    <span class="theme-icon theme-icon-light">☀️</span>
  </button>

  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">🔑</div>
      <div>
        <div class="auth-logo-text">XSSNIPER</div>
        <div class="auth-logo-sub">ACCOUNT RECOVERY</div>
      </div>
    </div>

    <div class="auth-heading">Forgot Password</div>
    <div class="auth-subhead">Enter your email and we'll send you a reset link.</div>

    <div id="fp-error" class="auth-error"></div>
    <div id="fp-success" class="auth-success"></div>

    <div id="fp-form-wrap">
      <div class="form-group">
        <label class="form-label" for="fp-email">Email Address</label>
        <input id="fp-email" class="form-input" type="email"
               placeholder="you@email.com" autocomplete="email" required>
      </div>

      <button id="fp-btn" class="btn btn-primary btn-lg"
              style="width:100%;font-weight:600;" onclick="doForgotPassword()">
        Send Reset Link
      </button>
    </div>

    <p style="text-align:center;margin-top:20px;font-size:13px;color:var(--textSub);">
      Remember your password?
      <a href="/login" style="color:var(--accent);text-decoration:none;margin-left:4px;font-weight:600;">Sign in →</a>
    </p>
  </div>
</div>

<script src="/static/js/app.js"></script>
<script>
async function doForgotPassword() {
  var email = document.getElementById('fp-email').value.trim();
  var btn   = document.getElementById('fp-btn');
  var errEl = document.getElementById('fp-error');
  var sucEl = document.getElementById('fp-success');

  errEl.style.display = 'none';
  sucEl.style.display = 'none';

  if (!email) {
    errEl.textContent   = '⚠ Please enter your email address.';
    errEl.style.display = 'block';
    return;
  }

  btn.disabled    = true;
  btn.textContent = 'Sending…';

  try {
    var res  = await fetch('/api/v1/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email }),
    });
    var data = await res.json();

    if (!res.ok) {
      errEl.textContent   = '⚠ ' + (data.detail || 'Something went wrong. Please try again.');
      errEl.style.display = 'block';
      btn.disabled        = false;
      btn.textContent     = 'Send Reset Link';
      return;
    }

    document.getElementById('fp-form-wrap').style.display = 'none';
    sucEl.innerHTML = '<strong>Check your inbox!</strong><br><br>' +
      'If <strong>' + email + '</strong> is registered, a password reset link has been sent.<br><br>' +
      '<span style="font-size:11px;opacity:0.7;">The link expires in 1 hour. Check spam if you don\'t see it.</span>';
    sucEl.style.display = 'block';

  } catch (err) {
    errEl.textContent   = '⚠ Network error. Please try again.';
    errEl.style.display = 'block';
    btn.disabled        = false;
    btn.textContent     = 'Send Reset Link';
  }
}

document.addEventListener('DOMContentLoaded', function () {
  document.getElementById('fp-email').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') doForgotPassword();
  });
});
</script>
</body>
</html>
