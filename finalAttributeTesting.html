<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Advanced XSS Context Lab</title>
<style>
body{font-family:Arial;padding:20px}
textarea{width:100%;height:80px}
.box{border:1px solid #ccc;padding:15px;margin-top:20px}
.test-area{border:1px dashed #999;padding:20px;margin-top:10px}
.scroll{height:80px;overflow:auto;border:1px solid #aaa}
.big{height:300px}
button{margin-top:10px;padding:8px 12px}
</style>
</head>
<body>

<h2>Advanced XSS Testing Playground (All tricky payloads supported)</h2>

<textarea id="payload" placeholder="Enter payload here"></textarea>
<br>
<button onclick="run()">Run Payload</button>

<div class="box">
<h3>HTML ATTRIBUTE (hover / click / key / focus)</h3>
<div id="attr" class="test-area"></div>
</div>

<div class="box">
<h3>FOCUS / BLUR (click then click outside)</h3>
<div id="focus" class="test-area"></div>
</div>

<div class="box">
<h3>SCROLL (scroll inside box)</h3>
<div id="scroll" class="scroll"></div>
</div>

<div class="box">
<h3>KEY EVENTS (type inside input)</h3>
<div id="key" class="test-area"></div>
</div>

<div class="box">
<h3>RIGHT CLICK / AUX CLICK</h3>
<div id="clicks" class="test-area"></div>
</div>

<div class="box">
<h3>SCRIPT BLOCK</h3>
<div id="script" class="test-area"></div>
</div>

<div class="box">
<h3>HTML TAG (media context)</h3>
<div id="tag" class="test-area"></div>
</div>

<div class="box">
<h3>URL HREF</h3>
<a id="link" href="#">Click me</a>
</div>

<script>
function run(){
let p=document.getElementById('payload').value;

// ATTRIBUTE (hover click)
document.getElementById('attr').innerHTML=
`<div ${p} style="padding:20px;background:#eee">Hover / Click me</div>`;

// focus blur
document.getElementById('focus').innerHTML=
`<input ${p} placeholder="click then click outside">`;

// scroll
document.getElementById('scroll').innerHTML=
`<div ${p} class="big">Scroll inside this box<br><br><br><br><br><br><br><br><br>end</div>`;

// key events
document.getElementById('key').innerHTML=
`<input ${p} placeholder="type here">`;

// right click / aux click
document.getElementById('clicks').innerHTML=
`<div ${p} style="padding:20px;background:#ddd">Right click or middle click</div>`;

// script block
try{
let code=`var a="${p}";`;
eval(code);
document.getElementById('script').innerText="no execution";
}catch(e){
document.getElementById('script').innerText="script executed / error";
}

// html tag media context
document.getElementById('tag').innerHTML=
`<video controls>
<source src="x" ${p}>
</video>`;

// href
document.getElementById('link').href=p;
}
</script>

</body>
</html>
