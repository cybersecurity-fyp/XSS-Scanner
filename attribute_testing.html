<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>XSS Testing Playground (Advanced)</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    textarea { width: 100%; margin: 10px 0; padding: 8px; }
    .box { border: 1px solid #ccc; padding: 15px; margin-top: 20px; }
    .area { margin-top: 10px; padding: 10px; border: 1px dashed #aaa; }
    button { padding: 10px 15px; }
  </style>
</head>
<body>

<h2>XSS Testing Playground (All Contexts)</h2>

<label>Enter Payload:</label>
<textarea id="payload"></textarea>

<button onclick="injectPayload()">Test Payload</button>

<!-- HTML TEXT -->
<div class="box">
  <h3>HTML TEXT (like &lt;pre&gt;)</h3>
  <pre id="htmlText"></pre>
</div>

<!-- HTML TAG -->
<div class="box">
  <h3>HTML TAG (Rendered)</h3>
  <div id="htmlTag" class="area"></div>
</div>

<!-- HTML ATTRIBUTE -->
<div class="box">
  <h3>HTML ATTRIBUTE (REAL injection simulation)</h3>
  <div id="attrArea" class="area">Hover / Click test will appear here</div>
</div>

<!-- SCRIPT BLOCK -->
<div class="box">
  <h3>SCRIPT BLOCK (JS Injection)</h3>
  <div id="scriptResult" class="area"></div>
</div>

<!-- URL HREF -->
<div class="box">
  <h3>URL HREF</h3>
  <a id="testLink" href="#">Click me</a>
</div>

<script>
function injectPayload() {
  let payload = document.getElementById('payload').value;

  // 1. HTML TEXT (safe rendering)
  document.getElementById('htmlText').textContent = payload;

  // 2. HTML TAG (actual rendering)
  document.getElementById('htmlTag').innerHTML = payload;

  // 3. ATTRIBUTE CONTEXT (REALISTIC INJECTION)
  document.getElementById('attrArea').innerHTML = `
    <input value="${payload}" style="display:block; margin-bottom:10px;">
    <div ${payload} style="padding:10px; background:#eee;">Hover or Click Me</div>
  `;

  // 4. SCRIPT BLOCK (simulate JS context)
  try {
    let scriptContainer = document.getElementById('scriptResult');
    scriptContainer.innerHTML = "Executing...";

    // Simulate vulnerable JS usage
    let code = `var x = "${payload}";`;

    // Try breaking context
    eval(code);

    scriptContainer.innerHTML += "<br>No execution detected";
  } catch (e) {
    document.getElementById('scriptResult').innerHTML = "JS Executed / Error: " + e;
  }

  // 5. HREF CONTEXT
  document.getElementById('testLink').setAttribute('href', payload);
}
</script>

</body>
</html>
